# Nixpacks configuration for Railway
# This project requires Python at runtime, Node.js only for build

[providers]
python = "3.11"

[phases.setup]
nixPkgs = ["...", "postgresql", "nodejs_18"]

[phases.install]
dependsOn = ["setup"]

[phases.build]
dependsOn = ["install"]

[start]
cmd = "honcho -f ProcfileRailway start"
