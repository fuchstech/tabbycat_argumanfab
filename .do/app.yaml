# DigitalOcean App Platform Specification
# Deploy using: doctl apps create --spec .do/app.yaml
# or through the DigitalOcean web console

name: tabbycat
region: fra  # Frankfurt - change to your preferred region (nyc, sfo, sgp, etc.)

databases:
  - name: tabbycat-db
    engine: PG
    production: true
    version: "14"

services:
  - name: redis
    image:
      registry_type: DOCKER_HUB
      registry: redis
      repository: redis
      tag: "7-alpine"
    instance_count: 1
    instance_size_slug: basic-xxs

  - name: web
    github:
      # Update these values with your repository details
      repo: YOUR_GITHUB_USERNAME/tabbycat
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    build_command: |
      npm run build && python ./tabbycat/manage.py collectstatic --noinput -v 0
    run_command: honcho -f ProcfileMulti.docker start
    instance_count: 1
    instance_size_slug: basic-xs
    http_port: 8000
    routes:
      - path: /
    health_check:
      http_path: /
      initial_delay_seconds: 40
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3

    envs:
      - key: DEBUG
        value: "0"
      - key: IN_DOCKER
        value: "1"
      - key: DOCKER_REDIS
        value: "1"
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DJANGO_SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: ALLOWED_HOSTS
        value: "${APP_DOMAIN},${web.PUBLIC_URL}"
      - key: REDIS_URL
        value: "${redis.PRIVATE_URL}"

  - name: worker
    github:
      repo: YOUR_GITHUB_USERNAME/tabbycat
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    run_command: python tabbycat/manage.py runworker notifications adjallocation venues
    instance_count: 1
    instance_size_slug: basic-xxs

    envs:
      - key: DEBUG
        value: "0"
      - key: IN_DOCKER
        value: "1"
      - key: DOCKER_REDIS
        value: "1"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DJANGO_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        value: "${redis.PRIVATE_URL}"

# Jobs for database migrations (runs before deployment)
jobs:
  - name: migrate
    github:
      repo: YOUR_GITHUB_USERNAME/tabbycat
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    kind: PRE_DEPLOY
    run_command: python tabbycat/manage.py migrate --noinput
    instance_count: 1
    instance_size_slug: basic-xxs

    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DJANGO_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
